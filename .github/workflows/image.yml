name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim preinstalled SDK disk space
        run: |
          # The CUDA base alone expands to about 28 GiB. Keep Docker's existing
          # daemon and discard only unused runner SDKs, never the workspace.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/graalvm \
            /usr/local/.ghcup
          df -h / /var/lib/docker

      - name: Select image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "sha=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "latest=$image:latest" >> "$GITHUB_OUTPUT"

      - name: Use the existing Docker daemon
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build once into the Docker daemon
        env:
          SHA_TAG: ${{ steps.image.outputs.sha }}
          LATEST_TAG: ${{ steps.image.outputs.latest }}
        run: |
          docker buildx build --platform linux/amd64 --load --push=false \
            --provenance=false --tag "$SHA_TAG" --tag "$LATEST_TAG" .

      - name: Check installed CLI
        env:
          IMAGE: ${{ steps.image.outputs.sha }}
        run: timeout 90s docker run --rm --network none --entrypoint omnivoice-demo "$IMAGE" --help

      - name: Check real UI through base nginx
        env:
          IMAGE: ${{ steps.image.outputs.sha }}
        run: |
          timeout 180s docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/smoke-image.py,target=/tmp/smoke-image.py,readonly" \
            --entrypoint python3 "$IMAGE" /tmp/smoke-image.py

      - name: Install isolated browser smoke tooling
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --no-package-lock playwright@1.58.2
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install chromium
          fi
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/smoke-key.pem" \
            -out "$RUNNER_TEMP/smoke-cert.pem" \
            -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"

      - name: Check real browser behind an HTTPS public proxy
        timeout-minutes: 6
        env:
          IMAGE: ${{ steps.image.outputs.sha }}
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
          SMOKE_CERT_FILE: ${{ runner.temp }}/smoke-cert.pem
          SMOKE_KEY_FILE: ${{ runner.temp }}/smoke-key.pem
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/browser-smoke
        run: |
          container="omnivoice-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container" || true
            fi
            docker rm -f "$container" || true
            exit "$status"
          }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            -p 127.0.0.1:18001:8001 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/smoke-image.py,target=/tmp/smoke-image.py,readonly" \
            -e GRADIO_ROOT_PATH=https://127.0.0.1:18443 \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            -e HF_HUB_DISABLE_TELEMETRY=1 -e GRADIO_ANALYTICS_ENABLED=False \
            --entrypoint python3 "$IMAGE" /tmp/smoke-image.py --serve
          node scripts/browser-smoke.cjs

      - name: Upload browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-smoke/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Log in to GHCR after smoke succeeds
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the checked artifact
        env:
          SHA_TAG: ${{ steps.image.outputs.sha }}
          LATEST_TAG: ${{ steps.image.outputs.latest }}
        run: |
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          digest="$(docker image inspect "$SHA_TAG" --format '{{index .RepoDigests 0}}')"
          {
            echo '## Published OmniVoice image'
            echo "- Commit tag: \`$SHA_TAG\`"
            echo "- Latest tag: \`$LATEST_TAG\`"
            echo "- Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
